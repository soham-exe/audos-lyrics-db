name: Fetch Reported Lyrics
on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fetch-lyrics:
    if: contains(github.event.issue.labels.*.name, 'report-lyrics')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Lyrics Fetcher
        run: |
          pip install requests
          python .github/scripts/fetch_lyrics.py "${{ github.event.issue.title }}"
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Lyrics Bot"
          git add lyrics_db.json
          git commit -m "Added lyrics for issue #${{ github.event.issue.number }}" || echo "No changes to commit"
          git push